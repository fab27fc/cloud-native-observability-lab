apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-demo
  namespace: observability-demo
  labels:
    app.kubernetes.io/name: crashloop-demo
    app.kubernetes.io/component: incident-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crashloop-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashloop-demo
        app.kubernetes.io/component: incident-demo
    spec:
      containers:
        - name: crashloop-demo
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo "Simulated failure"; exit 1
